<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>HK Mark Six - Rust WASM App</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f7f9fa;
            color: #333;
            text-align: center;
            padding-top: 60px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 { color: #c0392b; font-size: 24px; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 25px; }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #219653; }
        #result {
            margin-top: 35px;
            min-height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .ball {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 48px;
            height: 48px;
            background: radial-gradient(circle at 30% 30%, #e74c3c, #c0392b);
            color: white;
            font-weight: bold;
            font-size: 18px;
            border-radius: 50%;
            box-shadow: inset -3px -3px 6px rgba(0,0,0,0.3), 0 4px 6px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Hong Kong Mark Six</h1>
        <p>Generated instantly using Rust & WebAssembly</p>
        <button id="draw-btn">Draw Lucky Numbers</button>
        <div id="result">Click the button above!</div>
    </div>

    <script type="module">
        import init, { generate_marksix } from './pkg/marksix_wasm.js';

        async function run() {
            // Initialize the WebAssembly module
            await init();

            const btn = document.getElementById('draw-btn');
            const resultDiv = document.getElementById('result');

            btn.addEventListener('click', () => {
                const htmlOutput = generate_marksix();
                resultDiv.innerHTML = htmlOutput;
            });
        }

        run();
    </script>
</body>
</html>
